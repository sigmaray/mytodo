services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${MYTODO_DB_USER:-todoist}
      POSTGRES_PASSWORD: ${MYTODO_DB_PASSWORD:-todoist}
      POSTGRES_DB: ${MYTODO_DB_NAME:-todoist}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${MYTODO_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  dev:
    image: node:22-bookworm-slim
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${MYTODO_NODE_ENV:-development}
      PORT: ${MYTODO_PORT:-3000}
      MYTODO_DB_HOST: postgres
      MYTODO_DB_PORT: 5432
      MYTODO_DB_USER: ${MYTODO_DB_USER:-todoist}
      MYTODO_DB_PASSWORD: ${MYTODO_DB_PASSWORD:-todoist}
      MYTODO_DB_NAME: ${MYTODO_DB_NAME:-todoist}
      MYTODO_ATTACHMENTS_DIR: /var/lib/mytodo/attachments
      MYTODO_ATTACHMENTS_ENABLED: "true"
      MYTODO_PROJECT_ARCHIVING_ENABLED: ${MYTODO_PROJECT_ARCHIVING_ENABLED:-false}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_USE_POLLING: "true"
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
      - root-node-modules:/workspace/node_modules
      - backend-node-modules:/workspace/apps/backend/node_modules
      - frontend-node-modules:/workspace/apps/frontend/node_modules
      - domain-node-modules:/workspace/packages/domain/node_modules
      - dev-attachments:/var/lib/mytodo/attachments
    command:
      - bash
      - -lc
      - |
        corepack enable
        corepack prepare pnpm@11.20.0 --activate
        pnpm config set store-dir /pnpm/store
        pnpm install --frozen-lockfile
        pnpm --filter @todoist-clone/backend exec drizzle-kit migrate --config drizzle.config.ts
        pnpm --filter @todoist-clone/backend dev &
        pnpm --filter @todoist-clone/frontend dev --host 0.0.0.0

volumes:
  postgres-data:
  pnpm-store:
  root-node-modules:
  backend-node-modules:
  frontend-node-modules:
  domain-node-modules:
  dev-attachments:
