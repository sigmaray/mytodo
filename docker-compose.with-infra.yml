# Self-contained production stack: app, PostgreSQL, and Caddy reverse proxy.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MYTODO_POSTGRES_USER:-todoist}
      POSTGRES_PASSWORD: ${MYTODO_POSTGRES_PASSWORD:?Set MYTODO_POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${MYTODO_POSTGRES_DB:-todoist}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  todoist-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${MYTODO_POSTGRES_USER:-todoist}:${MYTODO_POSTGRES_PASSWORD}@postgres:5432/${MYTODO_POSTGRES_DB:-todoist}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-internal

  todoist-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    restart: unless-stopped
    depends_on:
      todoist-api:
        condition: service_healthy
    networks:
      - app-internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MYTODO_DOMAIN: ${MYTODO_DOMAIN:?Set MYTODO_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      todoist-web:
        condition: service_started
    networks:
      - app-internal

networks:
  app-internal:
    driver: bridge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
