version: "3"

vars:
  MYTODO_DB_HOST: '{{.MYTODO_DB_HOST | default "127.0.0.1"}}'
  MYTODO_DB_PORT: '{{.MYTODO_DB_PORT | default "5432"}}'
  MYTODO_DB_USER: '{{.MYTODO_DB_USER | default "todoist"}}'
  MYTODO_DB_PASSWORD: '{{.MYTODO_DB_PASSWORD | default "todoist"}}'
  MYTODO_DB_NAME: '{{.MYTODO_DB_NAME | default "todoist"}}'
  MYTODO_DB_DUMP_FILE: '{{.MYTODO_DB_DUMP_FILE | default (printf "dumps/todoist-%s.dump" (now | date "2006-01-02_150405"))}}'

tasks:
  backend:
    desc: Run the backend API in watch mode
    cmds:
      - pnpm dev:backend

  frontend:
    desc: Run the frontend Vite dev server
    cmds:
      - pnpm dev:frontend

  dev:docker:
    desc: Run the full development environment through Docker Compose
    cmds:
      - docker compose --env-file .env.example -f docker-compose.dev.yml up

  prod:docker:
    desc: Build and start the production app using shared infrastructure
    cmds:
      - docker compose --env-file .env -f docker-compose.yml up -d --build

  prod:docker:down:
    desc: Stop the production app using shared infrastructure
    cmds:
      - docker compose --env-file .env -f docker-compose.yml down

  prod:docker:ps:
    desc: Show containers for the production app using shared infrastructure
    cmds:
      - docker compose --env-file .env -f docker-compose.yml ps

  prod:docker:logs:
    desc: Follow logs for the production app using shared infrastructure
    cmds:
      - docker compose --env-file .env -f docker-compose.yml logs -f

  prod:docker:external-infra:
    desc: Build and start production app using the shared infra network and PostgreSQL
    cmds:
      - docker compose --env-file .env.production -f docker-compose.yml up -d --build

  prod:docker:external-infra:down:
    desc: Stop production app using the shared infra network
    cmds:
      - docker compose --env-file .env.production -f docker-compose.yml down

  prod:docker:external-infra:ps:
    desc: Show containers for production app using shared infra
    cmds:
      - docker compose --env-file .env.production -f docker-compose.yml ps

  prod:docker:external-infra:logs:
    desc: Follow logs for production app using shared infra
    cmds:
      - docker compose --env-file .env.production -f docker-compose.yml logs -f

  prod:docker:external-infra:users:list:
    desc: List accounts in the shared-infrastructure production database
    cmds:
      - docker compose --env-file .env.production -f docker-compose.yml exec -T todoist-api ../../node_modules/.bin/tsx src/users-cli.ts list

  prod:docker:external-infra:users:create:
    desc: Create a production account using shared infrastructure (USERNAME=... PASSWORD=... [ADMIN=true])
    vars:
      USERNAME: '{{.USERNAME | default ""}}'
      PASSWORD: '{{.PASSWORD | default ""}}'
      ADMIN: '{{.ADMIN | default "false"}}'
    cmds:
      - test -n "{{.USERNAME}}" && test -n "{{.PASSWORD}}"
      - docker compose --env-file .env.production -f docker-compose.yml exec -T todoist-api ../../node_modules/.bin/tsx src/users-cli.ts create "{{.USERNAME}}" "{{.PASSWORD}}" {{if eq .ADMIN "true"}}--admin{{end}}

  prod:docker:external-infra:users:update:
    desc: Update a production account using shared infrastructure (USERNAME=... [NAME=...] [PASSWORD=...] [ADMIN=true|false])
    vars:
      USERNAME: '{{.USERNAME | default ""}}'
      NAME: '{{.NAME | default ""}}'
      PASSWORD: '{{.PASSWORD | default ""}}'
      ADMIN: '{{.ADMIN | default ""}}'
    cmds:
      - test -n "{{.USERNAME}}"
      - docker compose --env-file .env.production -f docker-compose.yml exec -T todoist-api ../../node_modules/.bin/tsx src/users-cli.ts update "{{.USERNAME}}" {{if .NAME}}--name="{{.NAME}}"{{end}} {{if .PASSWORD}}--password="{{.PASSWORD}}"{{end}} {{if .ADMIN}}--admin={{.ADMIN}}{{end}}

  prod:docker:external-infra:users:delete:
    desc: Delete a production account using shared infrastructure (USERNAME=...)
    vars:
      USERNAME: '{{.USERNAME | default ""}}'
    cmds:
      - test -n "{{.USERNAME}}"
      - docker compose --env-file .env.production -f docker-compose.yml exec -T todoist-api ../../node_modules/.bin/tsx src/users-cli.ts delete "{{.USERNAME}}"

  prod:docker:users:list:
    desc: List accounts in the production database
    cmds:
      - docker compose --env-file .env -f docker-compose.yml exec -T todoist-api ../../node_modules/.bin/tsx src/users-cli.ts list

  prod:docker:users:create:
    desc: Create a production account (USERNAME=... PASSWORD=... [ADMIN=true])
    vars:
      USERNAME: '{{.USERNAME | default ""}}'
      PASSWORD: '{{.PASSWORD | default ""}}'
      ADMIN: '{{.ADMIN | default "false"}}'
    cmds:
      - test -n "{{.USERNAME}}" && test -n "{{.PASSWORD}}"
      - docker compose --env-file .env -f docker-compose.yml exec -T todoist-api ../../node_modules/.bin/tsx src/users-cli.ts create "{{.USERNAME}}" "{{.PASSWORD}}" {{if eq .ADMIN "true"}}--admin{{end}}

  prod:docker:users:update:
    desc: Update a production account (USERNAME=... [NAME=...] [PASSWORD=...] [ADMIN=true|false])
    vars:
      USERNAME: '{{.USERNAME | default ""}}'
      NAME: '{{.NAME | default ""}}'
      PASSWORD: '{{.PASSWORD | default ""}}'
      ADMIN: '{{.ADMIN | default ""}}'
    cmds:
      - test -n "{{.USERNAME}}"
      - docker compose --env-file .env -f docker-compose.yml exec -T todoist-api ../../node_modules/.bin/tsx src/users-cli.ts update "{{.USERNAME}}" {{if .NAME}}--name="{{.NAME}}"{{end}} {{if .PASSWORD}}--password="{{.PASSWORD}}"{{end}} {{if .ADMIN}}--admin={{.ADMIN}}{{end}}

  prod:docker:users:delete:
    desc: Delete a production account (USERNAME=...)
    vars:
      USERNAME: '{{.USERNAME | default ""}}'
    cmds:
      - test -n "{{.USERNAME}}"
      - docker compose --env-file .env -f docker-compose.yml exec -T todoist-api ../../node_modules/.bin/tsx src/users-cli.ts delete "{{.USERNAME}}"

  test:
    desc: Run unit, integration, UI, and E2E tests
    cmds:
      - pnpm test
      - pnpm test:e2e

  test:unit:
    desc: Run domain, backend, and frontend tests without Playwright
    cmds:
      - pnpm test

  test:docker:
    desc: Alias for test:docker:app
    cmds:
      - task: test:docker:app

  test:docker:app:
    desc: Run the app in Docker test mode, execute all tests, and stop it
    cmds:
      - |
        status=0
        docker compose --env-file .env.example -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from tests tests || status=$?
        docker compose --env-file .env.example -f docker-compose.test.yml down -v --remove-orphans
        exit $status

  db:create:
    desc: Create the PostgreSQL database if it does not exist
    cmds:
      - |
        PGPASSWORD="{{.MYTODO_DB_PASSWORD}}" psql -h "{{.MYTODO_DB_HOST}}" -p "{{.MYTODO_DB_PORT}}" -U "{{.MYTODO_DB_USER}}" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '{{.MYTODO_DB_NAME}}'" | grep -q 1 \
          || PGPASSWORD="{{.MYTODO_DB_PASSWORD}}" createdb -h "{{.MYTODO_DB_HOST}}" -p "{{.MYTODO_DB_PORT}}" -U "{{.MYTODO_DB_USER}}" "{{.MYTODO_DB_NAME}}"

  db:drop-tables:
    desc: Drop all tables in the PostgreSQL database
    cmds:
      - |
        PGPASSWORD="{{.MYTODO_DB_PASSWORD}}" psql -h "{{.MYTODO_DB_HOST}}" -p "{{.MYTODO_DB_PORT}}" -U "{{.MYTODO_DB_USER}}" -d "{{.MYTODO_DB_NAME}}" -v ON_ERROR_STOP=1 -c 'DO $$ DECLARE item RECORD; BEGIN FOR item IN (SELECT tablename FROM pg_tables WHERE schemaname = current_schema()) LOOP EXECUTE format(''DROP TABLE IF EXISTS %I CASCADE'', item.tablename); END LOOP; END $$;'

  db:migrate:
    desc: Run Drizzle migrations for the PostgreSQL database
    dir: apps/backend
    cmds:
      - MYTODO_DB_HOST="{{.MYTODO_DB_HOST}}" MYTODO_DB_PORT="{{.MYTODO_DB_PORT}}" MYTODO_DB_USER="{{.MYTODO_DB_USER}}" MYTODO_DB_PASSWORD="{{.MYTODO_DB_PASSWORD}}" MYTODO_DB_NAME="{{.MYTODO_DB_NAME}}" pnpm exec drizzle-kit migrate --config drizzle.config.ts

  dev:docker:db:dump:
    desc: Save a restorable custom-format dump from the dev Docker database
    cmds:
      - mkdir -p "$(dirname "{{.MYTODO_DB_DUMP_FILE}}")"
      - docker compose --env-file .env.example -f docker-compose.dev.yml exec -T postgres pg_dump -U "{{.MYTODO_DB_USER}}" -d "{{.MYTODO_DB_NAME}}" --format=custom > "{{.MYTODO_DB_DUMP_FILE}}"
      - echo "Database dump saved to {{.MYTODO_DB_DUMP_FILE}}"

  dev:docker:db:restore:
    desc: Restore a custom-format dump into the dev Docker database (replaces existing objects)
    vars:
      DUMP_FILE: '{{.DUMP_FILE | default .MYTODO_DB_DUMP_FILE}}'
    cmds:
      - test -f "{{.DUMP_FILE}}"
      - docker compose --env-file .env.example -f docker-compose.dev.yml exec -T postgres pg_restore -U "{{.MYTODO_DB_USER}}" -d "{{.MYTODO_DB_NAME}}" --clean --if-exists --no-owner --no-privileges --exit-on-error < "{{.DUMP_FILE}}"

  dev:docker:users:list:
    desc: List user accounts in the development database
    dir: apps/backend
    cmds:
      - MYTODO_DB_HOST="{{.MYTODO_DB_HOST}}" MYTODO_DB_PORT="{{.MYTODO_DB_PORT}}" MYTODO_DB_USER="{{.MYTODO_DB_USER}}" MYTODO_DB_PASSWORD="{{.MYTODO_DB_PASSWORD}}" MYTODO_DB_NAME="{{.MYTODO_DB_NAME}}" pnpm users list

  dev:docker:users:create:
    desc: Create a user account (USERNAME=... PASSWORD=... [ADMIN=true])
    vars:
      USERNAME: '{{.USERNAME | default ""}}'
      PASSWORD: '{{.PASSWORD | default ""}}'
      ADMIN: '{{.ADMIN | default "false"}}'
    dir: apps/backend
    cmds:
      - test -n "{{.USERNAME}}" && test -n "{{.PASSWORD}}"
      - MYTODO_DB_HOST="{{.MYTODO_DB_HOST}}" MYTODO_DB_PORT="{{.MYTODO_DB_PORT}}" MYTODO_DB_USER="{{.MYTODO_DB_USER}}" MYTODO_DB_PASSWORD="{{.MYTODO_DB_PASSWORD}}" MYTODO_DB_NAME="{{.MYTODO_DB_NAME}}" pnpm users create "{{.USERNAME}}" "{{.PASSWORD}}" {{if eq .ADMIN "true"}}--admin{{end}}

  dev:docker:users:update:
    desc: Update an account (USERNAME=... [NAME=...] [PASSWORD=...] [ADMIN=true|false])
    vars:
      USERNAME: '{{.USERNAME | default ""}}'
      NAME: '{{.NAME | default ""}}'
      PASSWORD: '{{.PASSWORD | default ""}}'
      ADMIN: '{{.ADMIN | default ""}}'
    dir: apps/backend
    cmds:
      - test -n "{{.USERNAME}}"
      - MYTODO_DB_HOST="{{.MYTODO_DB_HOST}}" MYTODO_DB_PORT="{{.MYTODO_DB_PORT}}" MYTODO_DB_USER="{{.MYTODO_DB_USER}}" MYTODO_DB_PASSWORD="{{.MYTODO_DB_PASSWORD}}" MYTODO_DB_NAME="{{.MYTODO_DB_NAME}}" pnpm users update "{{.USERNAME}}" {{if .NAME}}--name="{{.NAME}}"{{end}} {{if .PASSWORD}}--password="{{.PASSWORD}}"{{end}} {{if .ADMIN}}--admin={{.ADMIN}}{{end}}

  dev:docker:users:delete:
    desc: Delete a user account (USERNAME=...)
    vars:
      USERNAME: '{{.USERNAME | default ""}}'
    dir: apps/backend
    cmds:
      - test -n "{{.USERNAME}}"
      - MYTODO_DB_HOST="{{.MYTODO_DB_HOST}}" MYTODO_DB_PORT="{{.MYTODO_DB_PORT}}" MYTODO_DB_USER="{{.MYTODO_DB_USER}}" MYTODO_DB_PASSWORD="{{.MYTODO_DB_PASSWORD}}" MYTODO_DB_NAME="{{.MYTODO_DB_NAME}}" pnpm users delete "{{.USERNAME}}"
