# Production app stack. PostgreSQL and Caddy are provided by the shared infra stack.
services:
  todoist-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: todoist-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
    networks:
      - app-internal
      - infra

  todoist-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: todoist-web
    restart: unless-stopped
    depends_on:
      todoist-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TODOIST_HTTP_PORT:-18082}:80"
    networks:
      - app-internal
      - infra
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-internal:
    driver: bridge
  infra:
    external: true
    name: infra
