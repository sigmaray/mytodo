# Self-contained production stack: app, PostgreSQL, and Caddy reverse proxy.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MYTODO_DB_USER:-todoist}
      POSTGRES_PASSWORD: ${MYTODO_DB_PASSWORD:?Set MYTODO_DB_PASSWORD in .env.production}
      POSTGRES_DB: ${MYTODO_DB_NAME:-todoist}
    volumes:
      - type: bind
        source: ${MYTODO_POSTGRES_VOLUME:-./v-postgres}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  todoist-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MYTODO_DB_HOST: postgres
      MYTODO_DB_PORT: 5432
      MYTODO_DB_USER: ${MYTODO_DB_USER:-todoist}
      MYTODO_DB_PASSWORD: ${MYTODO_DB_PASSWORD:?Set MYTODO_DB_PASSWORD in .env.production}
      MYTODO_DB_NAME: ${MYTODO_DB_NAME:-todoist}
      MYTODO_ATTACHMENTS_DIR: ${MYTODO_ATTACHMENTS_DIR:-/var/lib/mytodo/attachments}
      MYTODO_ATTACHMENTS_ENABLED: ${MYTODO_ATTACHMENTS_ENABLED:-false}
      MYTODO_PROJECT_ARCHIVING_ENABLED: ${MYTODO_PROJECT_ARCHIVING_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${MYTODO_ATTACHMENTS_VOLUME:-./v-attachments}
        target: /var/lib/mytodo/attachments
        bind:
          create_host_path: true
    networks:
      - app-internal

  todoist-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    restart: unless-stopped
    depends_on:
      todoist-api:
        condition: service_healthy
    networks:
      - app-internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MYTODO_DOMAIN: ${MYTODO_DOMAIN:?Set MYTODO_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      todoist-web:
        condition: service_started
    networks:
      - app-internal

networks:
  app-internal:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
