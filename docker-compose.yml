# Production app stack. PostgreSQL and Caddy are provided by the shared infra stack.
services:
  todoist-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: todoist-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MYTODO_DB_HOST: ${MYTODO_DB_HOST:?Set MYTODO_DB_HOST in .env.production}
      MYTODO_DB_PORT: ${MYTODO_DB_PORT:-5432}
      MYTODO_DB_USER: ${MYTODO_DB_USER:?Set MYTODO_DB_USER in .env.production}
      MYTODO_DB_PASSWORD: ${MYTODO_DB_PASSWORD:?Set MYTODO_DB_PASSWORD in .env.production}
      MYTODO_DB_NAME: ${MYTODO_DB_NAME:?Set MYTODO_DB_NAME in .env.production}
      MYTODO_ATTACHMENTS_DIR: ${MYTODO_ATTACHMENTS_DIR:-}
      MYTODO_ATTACHMENTS_ENABLED: ${MYTODO_ATTACHMENTS_ENABLED:-false}
      MYTODO_PROJECT_ARCHIVING_ENABLED: ${MYTODO_PROJECT_ARCHIVING_ENABLED:-false}
    volumes:
      - mytodo_attachments:/var/lib/mytodo/attachments
    networks:
      - app-internal
      - infra

  todoist-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: todoist-web
    restart: unless-stopped
    depends_on:
      todoist-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MYTODO_HTTP_PORT:-18082}:80"
    networks:
      - app-internal
      - infra
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-internal:
    driver: bridge
  infra:
    external: true
    name: infra

volumes:
  mytodo_attachments:
